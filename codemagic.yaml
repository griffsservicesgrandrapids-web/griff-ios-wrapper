workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.griffservices.griffservices

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor Setup
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest
          rm -rf ios/
          npx cap add ios
          npm run build
          npx cap sync ios

          echo "=== Full directory structure after sync ==="
          find ios -type f -name "Podfile" -o -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20

      - name: Install CocoaPods
        script: |
          echo "=== Searching for Podfile ==="
          PODFILE_PATH=$(find ios -name "Podfile" -type f | head -1)

          if [ -n "$PODFILE_PATH" ]; then
            echo "Found Podfile at: $PODFILE_PATH"
            cd "$(dirname "$PODFILE_PATH")"
            pod install --repo-update
            echo "Pod install completed"
          else
            echo "ERROR: No Podfile found anywhere in ios/ directory"
            ls -laR ios/
            exit 1
          fi

      - name: Set up code signing
        script: |
          echo "=== Setting up code signing ==="
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          echo "Starting archive..."
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
