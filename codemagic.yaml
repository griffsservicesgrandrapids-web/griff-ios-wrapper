workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.griffservices.griffservices

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Ensure Capacitor CLI and Sync iOS
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest
          rm -rf ios/
          npx cap add ios
          npm run build
          npx cap sync ios

          echo "=== Directory structure after sync ==="
          ls -la ios/
          ls -la ios/App/
          ls -la ios/App/App/ || true

      - name: Install CocoaPods
        script: |
          echo "=== Looking for Podfile ==="
          if [ -f "ios/App/Podfile" ]; then
            echo "Found Podfile at ios/App/Podfile"
            cd ios/App
            pod install --repo-update
          elif [ -f "ios/App/App/Podfile" ]; then
            echo "Found Podfile at ios/App/App/Podfile"
            cd ios/App/App
            pod install --repo-update
          else
            echo "ERROR: Podfile not found in expected locations"
            find ios -name "Podfile" -type f
            exit 1
          fi
          echo "Pod install completed"
          cd ../..

      - name: Set up code signing
        script: |
          echo "=== Setting up code signing ==="
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          echo "Starting archive..."
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
