workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Ensure Capacitor CLI
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest

      - name: Clean and recreate iOS platform
        script: |
          rm -rf ios/
          npx cap add ios

      - name: Build web assets and sync
        script: |
          npm run build
          npx cap sync ios

      - name: Install CocoaPods (if needed)
        script: |
          if [ -d "ios/App" ] && [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install --repo-update && cd ../..
            echo "CocoaPods installed"
          else
            echo "No Podfile - skipping (SPM likely in use)"
          fi

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          echo "Starting archive..."
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
