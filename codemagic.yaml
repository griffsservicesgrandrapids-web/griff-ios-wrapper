workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets and sync Capacitor
        script: |
          npm run build
          ls -la dist/ || echo "ERROR: dist/ folder missing!"

          # This should create or update the ios/App folder and prepare for pods
          npx cap sync ios --no-open

          echo "=== Contents of ios/App after cap sync ==="
          ls -la ios/App || echo "ios/App folder is missing!"

      - name: Install CocoaPods (this generates the .xcworkspace)
        script: |
          cd ios/App
          echo "Running pod install..."
          pod install --repo-update

          echo "=== Workspace check after pod install ==="
          ls -la App.xcworkspace || echo "❌ App.xcworkspace is STILL MISSING!"
          ls -la *.xcodeproj || echo "No .xcodeproj found"
          ls -la Podfile.lock || echo "No Podfile.lock"
          cd ../..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
