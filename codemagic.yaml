workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        BUNDLE_ID: "com.griffservices.griffservices"   # ← Make sure this is 100% exact
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Ensure Capacitor CLI
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest

      - name: Clean and recreate iOS platform
        script: |
          rm -rf ios/
          npx cap add ios

      - name: Build web assets and sync
        script: |
          npm run build
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          if [ -d "ios/App" ]; then
            cd ios/App
            if [ -f "Podfile" ]; then
              pod install --repo-update
            fi
            echo "=== Files after pod install ==="
            ls -la App.xcworkspace App.xcodeproj || true
            cd ../..
          fi

      # Automatic signing steps
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
