workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.griffservices.griffservices

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor Setup
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest
          rm -rf ios/
          npx cap add ios
          npm run build
          npx cap sync ios

      - name: CocoaPods
        script: |
          cd ios/App && pod install --repo-update && cd ../..

      - name: Code Signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
