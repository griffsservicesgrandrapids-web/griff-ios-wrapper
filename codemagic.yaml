workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.griffservices.griffsservices"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Ensure Capacitor CLI
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest

      - name: Clean and recreate iOS platform
        script: |
          rm -rf ios/
          npx cap add ios

          echo "=== iOS folder structure after cap add ==="
          ls -la ios/
          ls -la ios/App/ || echo "ios/App is missing!"

      - name: Build web assets and sync
        script: |
          npm run build
          npx cap sync ios

          echo "=== After cap sync ==="
          ls -la ios/App/

      - name: Install CocoaPods (if Podfile exists)
        script: |
          if [ -d "ios/App" ]; then
            cd ios/App
            if [ -f "Podfile" ]; then
              echo "Podfile found - running pod install"
              pod install --repo-update
            else
              echo "No Podfile found - skipping CocoaPods (SPM mode)"
            fi
            echo "=== Final check ==="
            ls -la App.xcworkspace || echo "Workspace missing"
            ls -la App.xcodeproj || echo "Project missing"
            cd ../..
          else
            echo "ERROR: ios/App directory not found"
          fi

      - name: Set up code signing
        script: |
          echo "Applying provisioning profile to main project..."
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --bundle-identifier "$BUNDLE_ID" \
            --distribution-type app_store

          echo "=== Signing settings verification ==="
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | grep -E "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE" || echo "No signing settings found"

      - name: Build IPA
        script: |
          echo "Starting archive..."
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist=/Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
