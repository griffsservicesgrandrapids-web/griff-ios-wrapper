workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: 22          # ← Changed to 22 (required by Capacitor v8)
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Ensure Capacitor CLI
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest

      - name: Clean and recreate iOS platform
        script: |
          rm -rf ios/

          npx cap add ios

          echo "=== iOS folder after cap add ==="
          ls -la ios/ || echo "ios/ folder missing!"

      - name: Build web assets and sync
        script: |
          npm run build
          ls -la dist/ || echo "ERROR: dist/ missing!"

          npx cap sync ios --no-open

          echo "=== After cap sync ==="
          ls -la ios/App || echo "ios/App still missing!"

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

          echo "=== Workspace check after pod install ==="
          ls -la App.xcworkspace || echo "❌ Workspace STILL MISSING!"
          ls -la *.xcodeproj
          cd ../..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
