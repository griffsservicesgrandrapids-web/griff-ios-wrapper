workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Ensure Capacitor CLI
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest

      - name: Clean and recreate iOS platform
        script: |
          rm -rf ios/

          npx cap add ios

          echo "=== iOS folder after cap add ==="
          ls -la ios/

      - name: Build web assets and sync
        script: |
          npm run build
          ls -la dist/ || echo "ERROR: dist/ missing!"

          npx cap sync ios --no-open

          echo "=== After cap sync ==="
          ls -la ios/App || echo "ios/App folder missing!"

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

          echo "=== Final workspace & project check ==="
          ls -la App.xcworkspace || echo "❌ Workspace missing"
          ls -la App.xcodeproj || echo "❌ Project missing"
          cd ../..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # Try workspace first, fallback to project if workspace is missing
          if [ -f "$XCODE_WORKSPACE" ]; then
            echo "Using workspace for build"
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME" \
              --archive-flags="-destination 'generic/platform=iOS'"
          else
            echo "Workspace missing - falling back to project"
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --archive-flags="-destination 'generic/platform=iOS'"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
