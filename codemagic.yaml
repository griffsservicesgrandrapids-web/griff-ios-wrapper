workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets and sync iOS
        script: |
          npm run build
          ls -la dist/ || echo "ERROR: dist/ folder missing!"

          # Critical: Sync Capacitor to generate/update the iOS project and workspace
          npx cap sync ios --no-open

          echo "=== Contents of ios/App after cap sync ==="
          ls -la ios/App || echo "ios/App folder missing!"

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

          echo "=== Workspace check after pod install ==="
          ls -la App.xcworkspace || echo "❌ Workspace STILL missing after pod install!"
          ls -la .                   # show all files in ios/App
          cd ../..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
