workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.griffservices.griffsservices

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build
          ls -la dist/ || echo "ERROR: dist/ missing after build!"

      - name: Sync Capacitor iOS + CocoaPods
        script: |
          npx cap sync ios --no-open

          cd ios/App
          pod install --repo-update
          cd ../..

          # Verify workspace exists
          ls -la "$XCODE_WORKSPACE" || echo "WARNING: Workspace still missing!"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
