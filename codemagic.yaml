workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.griffservices.griffservices
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUILD_NUMBER: "12"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor Setup
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest
          rm -rf ios/
          npx cap add ios
          npm run build
          npx cap sync ios

      - name: CocoaPods Fix
        script: |
          echo "=== Forcing CocoaPods setup ==="
          cd ios/App
          if [ -f "Podfile" ]; then
            echo "Podfile exists - cleaning and installing..."
            rm -rf Pods Podfile.lock
            pod install --repo-update
          else
            echo "No Podfile - creating one..."
            pod init
            pod install --repo-update
          fi
          echo "=== Pods folder check ==="
          ls -la Pods/

      - name: Bump Version & Build Number
        script: |
          echo "Setting version 1.0.1 + build $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          echo "=== Building with workspace ==="
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
