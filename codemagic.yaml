workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.griffservices.griffservices
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUILD_NUMBER: "11"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor Setup
        script: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest
          rm -rf ios/
          npx cap add ios
          npm run build
          npx cap sync ios

      - name: Force Podfile creation + CocoaPods
        script: |
          echo "=== Checking ios folder structure ==="
          ls -la ios/
          ls -la ios/App/

          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile found - installing pods..."
            cd ios/App && pod install --repo-update
          else
            echo "Podfile missing - running manual pod init..."
            cd ios/App
            pod init
            pod install --repo-update
          fi

      - name: Bump Version & Build Number
        script: |
          echo "Setting version to 1.0.1 and build number to $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
