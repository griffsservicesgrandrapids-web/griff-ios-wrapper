workflows:
  ios-build:
    name: Build iOS
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: APIKey

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build
          ls -la dist/ || echo "ERROR: dist/ missing after build!"

      - name: Prepare iOS project
        script: |
          # Re-add iOS platform only if missing
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap sync ios --no-open

          echo "=== iOS folder contents ==="
          ls -la ios/App

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          echo "=== Workspace check ==="
          ls -la App.xcworkspace || echo "Workspace still missing!"
          cd ../..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
